<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AluraFlix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela 1: Formulario de Cadastro (Exibida Primeiro) -->
  <div id="authScreen" class="screen">
    <div class="auth-box">
      <h1>AluraFlix</h1>
      <h2>Crie sua conta para entrar</h2>
      <form id="userForm">
        <input type="text" id="name" placeholder="Nome Completo" required>
        <input type="email" id="email" placeholder="Seu E-mail" required>
        <button type="submit">Entrar no App</button>
      </form>
    </div>
  </div>

  <!-- Tela 2: Aplicativo de Filmes (Oculta ate cadastrar) -->
  <div id="appScreen" class="screen hidden">
    <header>
      <h1>AluraFlix</h1>
      <div class="user-info">
        <span id="userNameDisplay"></span>
        <button id="logoutBtn">Sair</button>
      </div>
    </header>

    <main>
      <section class="gallery-container">
        <h2>Catálogo de Filmes</h2>
        <div id="movieGallery" class="gallery"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
