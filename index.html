<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AluraFlix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Tela de Cadastro / Login -->
  <div id="authScreen" class="screen">
    <div class="auth-box">
      <h1>AluraFlix</h1>
      <h2>Cadastre-se para acessar o catálogo</h2>
      <form id="userForm">
        <input type="text" id="name" placeholder="Seu Nome" required>
        <input type="email" id="email" placeholder="Seu E-mail" required>
        <button type="submit">Entrar no App</button>
      </form>
    </div>
  </div>

  <!-- Tela Principal do Aplicativo -->
  <div id="appScreen" class="screen hidden">
    <header>
      <h1>AluraFlix</h1>
      <div class="user-info">
        <span id="userNameDisplay"></span>
        <button id="logoutBtn">Sair</button>
      </div>
    </header>

    <main>
      <section class="gallery-container">
        <h2>Catálogo de Filmes</h2>
        <div id="movieGallery" class="gallery"></div>
      </section>
    </main>
  </div>

  <!-- Modal do Player de Vídeo Interno -->
  <div id="videoModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal">Fechar Trailer</button>
      <div class="video-wrapper">
        <iframe id="videoPlayer" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
